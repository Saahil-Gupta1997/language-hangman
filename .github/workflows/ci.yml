name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Check release hygiene
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m src.cli release-check

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Validate supported desktop content
        run: python scripts/check_curated_content.py

      - name: Validate legacy word-bank content
        run: python -m src.cli validate-content --summary --coverage

  windows-desktop:
    # The supported product is a Windows desktop app: every push and pull request runs the
    # full test suite (including GUI tests) and the native smoke journey on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Run tests
        run: python -m pytest -rs
      - name: Native desktop smoke journey
        run: python desktop_app.py --smoke-test desktop-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-evidence
          path: desktop-evidence/
