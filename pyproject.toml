[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-learning-hangman"
dynamic = ["version"]
description = "Local-first Streamlit Hangman for language learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.56.0",
    "customtkinter==5.2.2",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "black==24.10.0",
    "ruff==0.6.9",
    "httpx==0.27.2",
]

[project.scripts]
language-hangman = "src.cli:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    ".pytest_tmp",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "pytest-cache-files-*",
    "pytest_tmp*",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML, CSS, and data URLs retain their browser-native formatting.
"src/gateway/login_page.py" = ["E501"]
"src/ui/home_page.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
