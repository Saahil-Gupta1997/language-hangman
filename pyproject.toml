[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-learning-hangman"
dynamic = ["version"]
description = "Offline Windows desktop Hangman for English travel vocabulary (Python, CustomTkinter, SQLite)."
readme = "README.md"
requires-python = ">=3.12"  # the only version built and tested
# Runtime: the desktop app only. The browser prototype is "legacy" (unsupported).
dependencies = ["customtkinter==5.2.2", "Pillow==12.3.0"]

[project.optional-dependencies]
legacy = ["streamlit==1.56.0", "fastapi==0.115.6", "uvicorn==0.32.1"]
dev = [
    "pytest==9.0.3",
    "black==24.10.0",
    "ruff==0.6.9",
    "httpx==0.27.2",
]

[project.scripts]
language-hangman = "desktop_app:main"  # supported desktop entry point
language-hangman-admin = "src.cli:main"  # legacy admin CLI (release-check still used in CI)

[tool.setuptools]
py-modules = ["app", "desktop_app"]

[tool.setuptools.package-data]
"src.desktop" = ["content/*.json"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "docs/evidence",  # recorded evidence is kept exactly as it was run
    ".git",
    ".idea",
    ".pytest_cache",
    ".pytest_tmp",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "pytest-cache-files-*",
    "pytest_tmp*",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML, CSS, and data URLs retain their browser-native formatting.
"src/gateway/login_page.py" = ["E501"]
"src/ui/home_page.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
